<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Booking | FlyAway</title>


    <style>


        body{
            margin: 0;
        }



        .contact-body .contact-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 22px 7%;
            background: #262c35;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .contact-body .logo {
            color: #ffffff;
            font-size: 27px;
            font-weight: 800;
            text-decoration: none;
            letter-spacing: -0.5px;
        }
        
        .contact-body .back-home {
            color: white;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.25s ease;
        }

        .contact-body .back-home:hover {
            color: #4784c4;
        }

        .flight-booking-page {
            min-height: 100vh;
            background: #f4f6fa;
        }

        

       .flight-booking-page .contact-layout {
            width: min(1100px, 90%);
            margin: 55px auto;
            display: grid;
            grid-template-columns: 0.9fr 1.1fr;
            gap: 40px;
            align-items: center;
        }

        
        .flight-booking-page .contact-info {
            padding: 30px 10px;
        }

        .flight-booking-page .contact-info h3 {
            color: #173b68;
            font-size: clamp(32px, 4vw, 46px);
            line-height: 1.15;
            margin-bottom: 18px;
        }

        .flight-booking-page .contact-info p {
            color: #667085;
            font-size: 16px;
            line-height: 1.8;
        }

        
        .flight-booking-page .contact-form-card {
            padding: 36px;
            background: #ffffff;
            border: 1px solid #edf0f5;
            border-radius: 18px;
            box-shadow: 0 15px 45px rgba(26, 48, 78, 0.09);
        }

        .flight-booking-page .contact-form-card h2 {
            color: #173b68;
            font-size: 27px;
            margin: 0 0 8px;
        }

        .flight-booking-page .contact-form-card>p {
            color: #7b8494;
            line-height: 1.6;
            margin-bottom: 26px;
        }

        
        .flight-booking-page .contact-form-card label {
            display: block;
            margin-bottom: 8px;
            color: #344054;
            font-size: 14px;
            font-weight: 600;
        }

        
        .flight-booking-page .contact-form-card input,
        .flight-booking-page .contact-form-card select {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 14px;
            margin-bottom: 19px;
            border: 1px solid #d8deea;
            border-radius: 9px;
            background: #ffffff;
            color: #253247;
            font: inherit;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .flight-booking-page .contact-form-card input:focus,
        .flight-booking-page .contact-form-card select:focus {
            border-color: #3569a8;
            box-shadow: 0 0 0 3px rgba(53, 105, 168, 0.12);
        }

        
        .flight-booking-page .contact-form-card button[type="submit"] {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 9px;
            background: #173b68;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.25s, transform 0.25s;
        }

        .flight-booking-page .contact-form-card button[type="submit"]:hover {
            background: #24558d;
            transform: translateY(-2px);
        }

        
        @media (max-width: 768px) {
            .flight-booking-page .contact-header {
                padding: 18px 5%;
                gap: 12px;
            }

            .flight-booking-page .contact-header .logo {
                font-size: 22px;
            }

            .flight-booking-page .contact-header .back-home {
                padding: 9px 12px;
                font-size: 13px;
            }

            .flight-booking-page .contact-layout {
                grid-template-columns: 1fr;
                gap: 20px;
                margin: 25px auto;
            }

            .flight-booking-page .contact-info {
                padding: 10px 0;
            }

            .flight-booking-page .contact-info h3 {
                font-size: 32px;
            }

            .flight-booking-page .contact-form-card {
                padding: 24px 20px;
            }
        }

    
    </style>








</head>

<body class="contact-body flight-booking-page">

    <header class="contact-header">
        <a href="index.html" class="logo">FlyAway</a>
        <a href="index.html" class="back-home">Back to Home</a>
    </header>

    <main class="contact-layout">

        <section class="contact-info">
            <h3>Book Your Flight</h3>
            <p>
                Your next adventure starts here. Choose your route,
                select your travel date, and submit your flight booking request.
            </p>
        </section>

        <section class="contact-form-card">
            <h2>Flight Details</h2>
            <p>Enter your details to request a flight booking.</p>

            <form id="flightForm">

                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>

                <label for="departure">Departure City</label>
                <input type="text" id="departure" name="departure" placeholder="Enter departure city" required>

                <label for="destination">Destination City</label>
                <input type="text" id="destination" name="destination" placeholder="Enter destination city" required>

                <label for="departureDate">Departure Date</label>
                <input type="date" id="departureDate" name="departureDate" required>

                <label for="passengers">Number of Passengers</label>
                <input type="number" id="passengers" name="passengers" min="1" max="20" value="1" required>

                <label for="travelClass">Travel Class</label>
                <select id="travelClass" name="travelClass" required>
                    <option value="">Select Class</option>
                    <option value="Economy">Economy</option>
                    <option value="Premium Economy">Premium Economy</option>
                    <option value="Business">Business</option>
                    <option value="First Class">First Class</option>
                </select>

                <button type="submit">Submit Flight Booking</button>

            </form>
        </section>

    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function () {

            const flightForm = document.getElementById("flightForm");
            const departureInput = document.getElementById("departure");
            const destinationInput = document.getElementById("destination");
            const departureDate = document.getElementById("departureDate");


            const today = new Date();
            const todayString = [
                today.getFullYear(),
                String(today.getMonth() + 1).padStart(2, "0"),
                String(today.getDate()).padStart(2, "0")
            ].join("-");

            departureDate.min = todayString;


            const params = new URLSearchParams(window.location.search);
            const from = params.get("from");
            const to = params.get("to");


            if (from) departureInput.value = from;
            if (to) destinationInput.value = to;

            flightForm.addEventListener("submit", function (event) {
                event.preventDefault();

                if (!flightForm.reportValidity()) return;

                if (departureDate.value < todayString) {
                    alert("Please select today or a future departure date.");
                    return;
                }

                const fullName = document.getElementById("fullName")
                    .value.trim();

                const email = document.getElementById("email")
                    .value.trim().toLowerCase();

                const departure = departureInput.value.trim();
                const destination = destinationInput.value.trim();

                if (departure.toLowerCase() === destination.toLowerCase()) {
                    alert("Departure and destination cities must be different.");
                    return;
                }

                const booking = {
                    id: "WF" + Date.now(),
                    type: "Flight",
                    fullName: fullName,
                    email: email,
                    departure: departure,
                    destination: destination,
                    departureDate: departureDate.value,
                    passengers: Number(
                        document.getElementById("passengers").value
                    ),
                    travelClass: document.getElementById("travelClass").value,
                    status: "Pending"
                };


                let bookings = [];

                try {
                    bookings = JSON.parse(
                        localStorage.getItem("FlyAwayBookings")
                    ) || [];

                    if (!Array.isArray(bookings)) {
                        bookings = [];
                    }
                } catch (error) {
                    alert("Could not read existing bookings. Please check your browser storage.");
                    return;
                }


                bookings.push(booking);

                try {
                    localStorage.setItem(
                        "FlyAwayBookings",
                        JSON.stringify(bookings)
                    );
                } catch (error) {
                    alert("Could not save your booking. Browser storage may be full.");
                    return;
                }

                alert(
                    "Flight booking request submitted successfully!" +
                    "\nReference: " + booking.id +
                    "\nRoute: " + booking.departure + " → " +
                    booking.destination
                );

                flightForm.reset();


                departureInput.value = from || "";
                destinationInput.value = to || "";
                departureDate.min = todayString;
            });

        });
    </script>

</body>

</html>

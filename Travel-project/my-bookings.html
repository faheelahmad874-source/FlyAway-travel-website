<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings | FlyAway</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .contact-body .contact-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 22px 7%;
            background: #262c35;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .contact-body .contact-logo {
            color: #ffffff;
            font-size: 27px;
            font-weight: 800;
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .contact-body .contact-home {
            color: white;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.25s ease;
        }

        .contact-body .contact-home:hover {
            color: #4784c4;
        }
    </style>
</head>

<body class="contact-body">

    <header class="contact-header">
        <a href="index.html" class="contact-logo">FlyAway</a>
        <a href="index.html" class="contact-home">← Back to Home</a>
    </header>

    <main class="my-bookings-page">
        <div class="bookings-heading">
            <p class="contact-tag">YOUR TRAVEL DASHBOARD</p>
            <h1>My <span>Bookings</span></h1>
            <p>Keep track of your tour requests and upcoming adventures.</p>
        </div>

        <div id="bookingsContainer" class="bookings-container"></div>
    </main>


    <script>
        const container = document.getElementById("bookingsContainer");

        let loggedInUser = null;
        let bookings = [];

        try {
            loggedInUser = JSON.parse(
                localStorage.getItem("FlyAwayLoggedInUser") || "null"
            );

            bookings = JSON.parse(
                localStorage.getItem("FlyAwayBookings") || "[]"
            );

            if (!Array.isArray(bookings)) {
                bookings = [];
            }
        } catch (error) {
            container.innerHTML = `
        <div class="empty-bookings">
            <h2>Unable to load bookings</h2>
            <p>Your saved booking data could not be read.</p>
        </div>
    `;
        }

        if (container.innerHTML === "") {
            if (!loggedInUser || !loggedInUser.email) {
                container.innerHTML = `
            <div class="empty-bookings">
                <h2>Please log in first</h2>
                <p>Log in to view your saved bookings.</p>
                <a href="login.html">Go to Login →</a>
            </div>
        `;
            } else {
                const userBookings = bookings.filter(function (booking) {
                    return booking.email &&
                        booking.email.toLowerCase() ===
                        loggedInUser.email.toLowerCase();
                });

                if (userBookings.length === 0) {
                    container.innerHTML = `
                <div class="empty-bookings">
                    <h2>No bookings yet</h2>
                    <p>Your tour, hotel and flight requests will appear here.</p>
                    <a href="index.html">Explore FlyAway →</a>
                </div>
            `;
                } else {
                    userBookings.forEach(function (booking) {
                        const card = document.createElement("article");
                        card.className = "booking-card";

                        const isHotel = booking.type === "Hotel";
                        const isFlight = booking.type === "Flight";

                        let bookingType;
                        let bookingTitle;
                        let travelPeriod;
                        let travellerCount;
                        let firstLabel;
                        let periodLabel;
                        let travellerLabel;
                        let finalLabel;
                        let finalValue;

                        if (isFlight) {
                            bookingType = "Flight Booking";
                            bookingTitle =
                                booking.departure + " → " + booking.destination;
                            travelPeriod = booking.departureDate;
                            travellerCount = booking.passengers;
                            firstLabel = "Flight Route";
                            periodLabel = "Departure Date";
                            travellerLabel = "Passengers";
                            finalLabel = "Travel Class";
                            finalValue = booking.travelClass || "—";
                        } else if (isHotel) {
                            bookingType = "Hotel Booking";
                            bookingTitle = booking.hotelName;
                            travelPeriod =
                                (booking.checkIn || "—") + " → " +
                                (booking.checkOut || "—");
                            travellerCount = booking.guests;
                            firstLabel = "Hotel";
                            periodLabel = "Check-in → Check-out";
                            travellerLabel = "Guests";
                            finalLabel = "Booking Type";
                            finalValue = "Hotel reservation";
                        } else {
                            bookingType = "Tour Package";
                            bookingTitle = booking.packageName;
                            travelPeriod = booking.travelDate;
                            travellerCount = booking.travellers;
                            firstLabel = "Package";
                            periodLabel = "Travel Date";
                            travellerLabel = "Travellers";
                            finalLabel = "Package Price";
                            finalValue = booking.price || "—";
                        }

                        card.innerHTML = `
                    <div class="booking-card-header">
                        <div>
                            <p class="booking-label">
                                ${bookingType.toUpperCase()} · REFERENCE
                            </p>
                            <h3 class="booking-reference"></h3>
                        </div>
                        <span class="booking-status"></span>
                    </div>

                    <div class="booking-details-grid">
                        <div>
                            <span class="booking-first-label"></span>
                            <strong class="booking-title"></strong>
                        </div>

                        <div>
                            <span>Destination</span>
                            <strong class="booking-destination"></strong>
                        </div>

                        <div>
                            <span class="booking-period-label"></span>
                            <strong class="booking-period"></strong>
                        </div>

                        <div>
                            <span class="booking-traveller-label"></span>
                            <strong class="booking-travellers"></strong>
                        </div>

                        <div>
                            <span class="booking-final-label"></span>
                            <strong class="booking-price"></strong>
                        </div>
                    </div>
                `;

                        card.querySelector(".booking-reference").textContent =
                            booking.id || "—";

                        card.querySelector(".booking-status").textContent =
                            booking.status || "Pending";

                        card.querySelector(".booking-first-label").textContent =
                            firstLabel;

                        card.querySelector(".booking-title").textContent =
                            bookingTitle || "—";

                        card.querySelector(".booking-destination").textContent =
                            booking.destination || "—";

                        card.querySelector(".booking-period-label").textContent =
                            periodLabel;

                        card.querySelector(".booking-period").textContent =
                            travelPeriod || "—";

                        card.querySelector(".booking-traveller-label").textContent =
                            travellerLabel;

                        card.querySelector(".booking-travellers").textContent =
                            travellerCount ?? "—";

                        card.querySelector(".booking-final-label").textContent =
                            finalLabel;

                        card.querySelector(".booking-price").textContent =
                            finalValue;

                        container.appendChild(card);
                    });
                }
            }
        }
    </script>


</body>

</html>
